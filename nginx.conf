server {
    listen 80;

    # Racine où se trouvent les fichiers générés par Vite (index.html, JS, CSS).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # C'est l'équivalent du "rewrite" dans vercel.json.
        # Explication : React Router gère des URLs comme /annonces/12 côté
        # client, mais ces chemins n'existent pas comme fichiers réels.
        # Cette ligne dit à nginx : "essaie de servir le fichier demandé,
        # sinon essaie un dossier, sinon renvoie index.html" — pour laisser
        # React Router prendre le relais dans le navigateur au lieu que
        # nginx renvoie une erreur 404.
        try_files $uri $uri/ /index.html;
    }
}